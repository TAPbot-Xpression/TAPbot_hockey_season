name: Scrape NCHC Hockey Stats
 
on:
  schedule:
    # Daily at 9:00 AM UTC
    - cron: "0 9 * * *"
  push:
    branches:
      - main
    paths:
      - "scrape_nchc_hockey.py"
      - "docs/index.html"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  workflow_dispatch:
    inputs:
      only_teams:
        description: "Teams or slugs to scrape (e.g. 'St. Thomas,Denver' or blank for all)"
        required: false
        default: ""
        type: string
      enable_debug:
        description: "Save raw debug HTML snapshots"
        required: false
        default: false
        type: boolean
 
permissions:
  contents: write    # Required to commit generated JSON files back to the repo
  pages: write       # Required to deploy docs/ to GitHub Pages
  id-token: write    # Required for Pages OIDC authentication
 
concurrency:
  group: scrape-and-deploy
  cancel-in-progress: false
 
jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      # ── 1. Check out the repository ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      # ── 3. Cache pip dependencies ────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
 
      # ── 4. Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      # ── 4b. Install Playwright browser ────────────────────────────────────────
      - name: Install Playwright browser
        run: |
          playwright install chromium-headless-shell
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()" \
            || playwright install --with-deps chromium-headless-shell
 
      # ── 5. Run NCHC Hockey Scraper ───────────────────────────────────────────
      - name: Run NCHC hockey scraper
        env:
          ONLY: ${{ inputs.only_teams }}
          DEBUG: ${{ inputs.enable_debug }}
        run: |
          CMD="python scrape_nchc_hockey.py"
          if [ -n "$ONLY" ]; then
            CMD="$CMD --only \"$ONLY\""
          fi
          if [ "$DEBUG" = "true" ]; then
            CMD="$CMD --debug"
          fi
          echo "Executing: $CMD"
          eval $CMD
 
      # ── 6. Commit all updated JSON files back to repo ───────────────────────
      - name: Commit and push updated stats
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/*.json *.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update NCHC Men's hockey stats [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
 
      # ── 7. Upload docs/ folder as Pages artifact ────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
 
      # ── 8. Deploy to GitHub Pages ────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
